# Por defecto usa una base H2 en memoria: no necesitas instalar nada para la demo.
spring.application.name=hce-avance
spring.datasource.url=jdbc:h2:mem:hce;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
server.port=8080
