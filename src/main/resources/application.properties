# Fase 0: H2 en archivo (sin servidor ni instalacion). Los datos viven en ./data junto al programa.
spring.application.name=hce-saas
spring.datasource.url=jdbc:h2:file:./data/hce
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.port=8090

# Plan v3 (item 0.1): sin cuentas ni datos de demostracion sembrados. Todo se crea desde las pantallas,
# a partir del administrador de plataforma inicial. Los tests activan sus propias cuentas de prueba.
hce.demo-usuarios=false
hce.demo-datos=false

# Abre el navegador al arrancar. Solo lo activa el lanzador portable (empaquetar.bat); en desarrollo y tests no.
hce.abrir-navegador=false

# Plan v3 (0.2, RN-14): administrador de plataforma inicial. Se crea solo si no existe ninguno.
# Debe cambiar esta clave temporal en su primer ingreso. Cambiala aqui antes de empaquetar si quieres otra.
hce.admin-inicial.usuario=admin
hce.admin-inicial.clave=Temporal2026
