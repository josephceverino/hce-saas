# Fase 0: H2 en archivo (sin servidor ni instalacion). Los datos viven en ./data junto al programa.
spring.application.name=hce-saas
spring.datasource.url=jdbc:h2:file:./data/hce
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.port=8090
