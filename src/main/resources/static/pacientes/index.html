<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pacientes · Plataforma HCE</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<div class="hce-app" id="app">
  <main class="hce-contenido" id="contenido">
    <div>
      <h1>Pacientes</h1>
      <p class="hce-subtitulo">Historias clínicas abiertas en tu hospital (RN-06).</p>
    </div>
    <section class="hce-tarjeta">
      <h2>Historias clínicas <span class="hce-chip" id="cuenta">0</span></h2>
      <div class="hce-buscador">
        <input id="buscar" type="search" placeholder="Buscar por DNI, N.° de historia o nombre" aria-label="Buscar paciente" autocomplete="off">
        <a class="hce-boton primario" id="nuevoPaciente" href="/pacientes/nuevo.html" hidden>Registrar paciente</a>
      </div>
      <div class="hce-tabla-contenedor">
        <table class="hce-tabla">
          <thead>
            <tr><th>N.° HC</th><th>Documento</th><th>Paciente</th><th>Apertura</th><th>Estado</th><th></th></tr>
          </thead>
          <tbody id="cuerpo"></tbody>
        </table>
        <div id="vacio" class="hce-vacio" hidden></div>
      </div>
      <div class="hce-paginacion">
        <span id="rango" class="hce-subtitulo"></span>
        <div class="botones">
          <button type="button" class="hce-boton claro" id="anterior">Anterior</button>
          <button type="button" class="hce-boton claro" id="siguiente">Siguiente</button>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="/js/comun.js"></script>
<script src="pacientes.js"></script>
</body>
</html>
