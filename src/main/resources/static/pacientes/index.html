<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pacientes · Plataforma HCE</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<div class="hce-app" id="app">
  <main class="hce-contenido" id="contenido">
    <div class="hce-encabezado">
      <div>
        <h1>Pacientes</h1>
        <p class="hce-subtitulo">Historias clínicas de tu hospital. Busca al paciente antes de registrarlo.</p>
      </div>
      <div class="hce-acciones">
        <a class="hce-boton primario" id="nuevoPaciente" href="/pacientes/nuevo.html" hidden>+ Registrar paciente</a>
      </div>
    </div>
    <div id="mensaje" class="hce-mensaje" role="status"></div>

    <section class="hce-tarjeta hce-tarjeta-tabla">
      <div class="hce-barra-tabla">
        <div class="hce-pestanas" role="tablist" id="pestanas"></div>
        <input id="buscar" class="hce-buscar" type="search" placeholder="Buscar por documento, historia o nombre" aria-label="Buscar paciente" autocomplete="off">
      </div>
      <div class="hce-tabla-contenedor">
        <table class="hce-tabla hce-tabla-limpia">
          <thead><tr><th>Paciente</th><th>Historia</th><th>Apertura</th><th>Hoy</th><th class="derecha">Acciones</th></tr></thead>
          <tbody id="cuerpo"></tbody>
        </table>
        <div id="vacio" class="hce-vacio" hidden></div>
      </div>
      <div class="hce-paginacion">
        <span id="rango" class="hce-subtitulo"></span>
        <div class="botones">
          <button type="button" class="hce-boton claro" id="anterior">Anterior</button>
          <button type="button" class="hce-boton claro" id="siguiente">Siguiente</button>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="/js/comun.js"></script>
<script src="pacientes.js"></script>
</body>
</html>
