<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Plataforma HCE</title>
<script>
  // Entrada: con sesion va a la primera opcion del menu de su rol; sin sesion, al login.
  fetch('/api/sesion').then(r => r.ok ? r.json() : null)
    .then(s => { window.location.replace(s && s.menu && s.menu.length ? s.menu[0].ruta : '/login/index.html'); })
    .catch(() => { window.location.replace('/login/index.html'); });
</script>
</head>
<body></body>
</html>
