<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoría · Plataforma HCE</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<div class="hce-app" id="app">
  <main class="hce-contenido" id="contenido">
    <div>
      <h1>Auditoría</h1>
      <p class="hce-subtitulo">Quién accedió a qué y cuándo en tu hospital. Es solo lectura: ningún registro se puede modificar ni borrar (RN-07).</p>
    </div>
    <div id="error" class="hce-mensaje" role="alert"></div>
    <section class="hce-tarjeta">
      <form id="filtros" class="hce-formulario">
        <label class="hce-campo">Usuario <input id="usuario" placeholder="Parte del nombre" autocomplete="off"></label>
        <label class="hce-campo">Acción
          <select id="accion"><option value="">Todas</option></select>
        </label>
        <label class="hce-campo">N.° de historia <input id="nroHc" placeholder="HC-000001" autocomplete="off"></label>
        <label class="hce-campo">Desde <input id="desde" type="date"></label>
        <label class="hce-campo">Hasta <input id="hasta" type="date"></label>
        <div class="hce-acciones ancho">
          <button class="hce-boton primario" type="submit">Filtrar</button>
          <button class="hce-boton claro" type="button" id="limpiar">Limpiar</button>
        </div>
      </form>
    </section>
    <section class="hce-tarjeta">
      <h2>Registros <span class="hce-chip" id="total">0</span></h2>
      <div class="hce-tabla-contenedor">
        <table class="hce-tabla">
          <thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Rol</th><th>Acción</th><th>Historia</th><th>IP</th></tr></thead>
          <tbody id="cuerpo"></tbody>
        </table>
        <div id="vacio" class="hce-vacio" hidden>No hay registros que coincidan con los filtros.</div>
      </div>
      <div class="hce-paginacion">
        <span id="rango" class="hce-subtitulo"></span>
        <div class="botones">
          <button type="button" class="hce-boton claro" id="anterior">Anterior</button>
          <button type="button" class="hce-boton claro" id="siguiente">Siguiente</button>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="/js/comun.js"></script>
<script src="auditoria.js"></script>
</body>
</html>
