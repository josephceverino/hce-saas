# Tests: base H2 en memoria, aislada de ./data/hce
spring.datasource.url=jdbc:h2:mem:hce-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
hce.demo-datos=false
# Cuentas de prueba (admision.a, medico.a, ... clave demo123): solo existen en los tests.
hce.demo-usuarios=true
